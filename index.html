<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulce o truco</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:#fff;overflow-x:hidden;background:#0b0820}
h1,h2,.btn{font-family:Creepster,Impact,cursive;font-weight:400;letter-spacing:.04em}
.view{display:none;min-height:100vh;position:relative;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.view.on{display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.content{position:relative;z-index:2}

/* ---------- INICIO ---------- */
#home{background:radial-gradient(ellipse at 50% 30%,#2a1a5e,#0b0820 70%)}
.moon{position:absolute;top:8%;right:12%;width:90px;height:90px;border-radius:50%;background:#fff6c9;box-shadow:0 0 60px 20px #fff6c955}
.web{position:absolute;width:min(220px,40vw);opacity:.55}
.web.tl{top:0;left:0}.web.tr{top:0;right:0;transform:scaleX(-1)}
.web.bl{bottom:0;left:0;transform:scaleY(-1)}.web.br{bottom:0;right:0;transform:scale(-1)}
.bat{position:absolute;left:-80px;width:56px;fill:#050310;animation:fly linear infinite}
.bat svg{width:100%;animation:flap .25s ease-in-out infinite alternate;transform-origin:center}
@keyframes fly{to{transform:translateX(calc(100vw + 160px))}}
@keyframes flap{to{transform:scaleY(.45)}}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,64px);padding:24px;flex-wrap:wrap}
.ghostbox{width:min(300px,70vw);position:relative}
.ghost{animation:sway 5s ease-in-out infinite alternate;display:block;width:100%;overflow:visible}
@keyframes sway{from{transform:translateX(-45px)}to{transform:translateX(45px)}}
.armL{transform-origin:46px 132px;animation:armL 6s ease-in-out infinite}
.armR{transform-origin:154px 132px;animation:armR 6s ease-in-out infinite}
@keyframes armL{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(155deg)}}
@keyframes armR{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(-155deg)}}
.boo{font-family:Creepster,Impact,cursive;font-size:44px;fill:#ffd23f;stroke:#7a2d00;stroke-width:1.5;opacity:0;animation:boo 6s ease-in-out infinite;transform-origin:100px 20px}
@keyframes boo{0%,62%,90%,100%{opacity:0;transform:scale(.4)}68%,84%{opacity:1;transform:scale(1.1)}}
.ghost .glow{filter:drop-shadow(0 0 18px #cfe8ff99)}
.msg{text-align:center;max-width:380px}
.msg h1{font-size:clamp(44px,8vw,76px);margin:0 0 20px;color:#ff9a1f;text-shadow:0 4px 0 #6b2b00}
.msg p{margin:0 0 22px;color:#cdc6f5;font-weight:600}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;font-size:36px;padding:10px 28px;border-radius:14px;border:0;cursor:pointer;color:#fff;text-decoration:none;transition:transform .15s}
.btn:hover,.btn:focus-visible{transform:scale(1.08) rotate(-2deg)}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
.b-dulce{background:linear-gradient(135deg,#ff4fa3,#ff9a1f)}
.b-truco{background:linear-gradient(135deg,#7a1fa2,#d62828)}

/* ---------- DULCES ---------- */
#dulces{background:#ffd9ec}
.slide{position:absolute;inset:0;opacity:0;animation:fade 24s infinite;display:flex;align-items:center;justify-content:center;font-size:min(60vw,420px);opacity:0}
.slide:nth-child(1){background:linear-gradient(135deg,#ff7eb6,#ffb36b);animation-delay:0s}
.slide:nth-child(2){background:linear-gradient(135deg,#7be0ff,#9d7bff);animation-delay:6s}
.slide:nth-child(3){background:linear-gradient(135deg,#ffe66b,#ff8f6b);animation-delay:12s}
.slide:nth-child(4){background:linear-gradient(135deg,#8cf0b0,#44c4e8);animation-delay:18s}
.slide span{opacity:.22;transform:rotate(-12deg)}
@keyframes fade{0%{opacity:0}6%,25%{opacity:1}31%,100%{opacity:0}}
.light{position:absolute;width:38vmin;height:38vmin;border-radius:50%;filter:blur(8px);animation:pulse 2.4s ease-in-out infinite alternate}
.light.a{top:-12vmin;left:-12vmin;background:radial-gradient(#fff700cc,#fff70000 70%)}
.light.b{top:-12vmin;right:-12vmin;background:radial-gradient(#ff3df2cc,#ff3df200 70%);animation-delay:.6s}
.light.c{bottom:-12vmin;left:-12vmin;background:radial-gradient(#33f5ffcc,#33f5ff00 70%);animation-delay:1.2s}
.light.d{bottom:-12vmin;right:-12vmin;background:radial-gradient(#7dff3dcc,#7dff3d00 70%);animation-delay:1.8s}
@keyframes pulse{from{opacity:.5;transform:scale(.85)}to{opacity:1;transform:scale(1.1)}}

/* ---------- RETOS ---------- */
#retos{background:linear-gradient(#1a0000,#5a0a00 55%,#c1270a 100%)}
.fire{position:absolute;left:0;right:0;bottom:0;height:22vh;background:radial-gradient(ellipse at 50% 100%,#ffb400cc,#ff4500aa 40%,#ff450000 75%);animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.7;transform:scaleY(1.12)}}
.pump{position:absolute;right:-90px;font-size:56px;animation:pass linear infinite}
@keyframes pass{50%{margin-top:-30px}to{transform:translateX(calc(-100vw - 180px)) rotate(-360deg)}}

/* ---------- compartido ---------- */
.page{max-width:900px;margin:0 auto;padding:24px 18px 60px}
.page h2{font-size:clamp(40px,7vw,64px);margin:12px 0 6px;text-shadow:0 3px 0 #0006}
.page .sub{margin:0 0 22px;font-weight:600}
.back{display:inline-block;color:#fff;font-weight:800;text-decoration:none;background:#0005;padding:8px 16px;border-radius:999px}
.panel{background:#ffffffe6;color:#2b1240;border-radius:20px;padding:18px;box-shadow:0 10px 30px #0004}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],textarea{font:inherit;font-weight:600;color:#2b1240;background:#fff;border:2px solid #d9c5ee;border-radius:10px;padding:10px 12px;width:100%}
.mini{font:inherit;font-weight:800;border:0;border-radius:10px;padding:0 16px;cursor:pointer;color:#fff;background:#d62828;min-height:44px}
.mini.add{background:#1fa86a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.box{background:#1b0707e6;border:3px solid #ff7a1a;border-radius:16px;padding:14px;box-shadow:0 0 18px #ff450088}
.box label{font-family:Creepster,Impact,cursive;font-size:26px;color:#ffb347;display:block;margin-bottom:6px}
.box textarea{min-height:130px;resize:vertical;background:#2a0e0e;color:#ffe9d2;border-color:#7a2d00}
.note{font-size:14px;margin-top:12px;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<!-- INICIO -->
<section class="view on" id="home">
  <div class="layer"><div class="moon"></div>
    <div id="bats"></div></div>
  <div class="layer webs"></div>
  <div class="content stage">
    <div class="ghostbox">
      <svg class="ghost" viewBox="0 0 200 250" aria-label="Fantasma animado">
        <text class="boo" x="100" y="38" text-anchor="middle">¡BOOO!</text>
        <g class="armL"><ellipse cx="34" cy="168" rx="12" ry="34" fill="#f4f8ff"/></g>
        <g class="armR"><ellipse cx="166" cy="168" rx="12" ry="34" fill="#f4f8ff"/></g>
        <path class="glow" fill="#f4f8ff" d="M40 125C40 28 160 28 160 125V218q-15 18-30 0q-15-18-30 0q-15 18-30 0q-15-18-30 0Z"/>
        <ellipse cx="78" cy="110" rx="10" ry="14" fill="#1a1230"/><ellipse cx="122" cy="110" rx="10" ry="14" fill="#1a1230"/>
        <ellipse cx="100" cy="148" rx="13" ry="17" fill="#1a1230"/>
      </svg>
    </div>
    <div class="msg">
      <h1>¿Dulce o truco?</h1>
      <p>Elige tu destino, si te atreves.</p>
      <div class="btns">
        <a class="btn b-dulce" href="#dulces">Dulce</a>
        <a class="btn b-truco" href="#retos">Truco</a>
      </div>
    </div>
  </div>
</section>

<!-- DULCES -->
<section class="view" id="dulces">
  <div class="layer">
    <div class="slide"><span>🍭</span></div><div class="slide"><span>🍬</span></div>
    <div class="slide"><span>🍫</span></div><div class="slide"><span>🍩</span></div>
  </div>
  <div class="layer"><div class="light a"></div><div class="light b"></div><div class="light c"></div><div class="light d"></div></div>
  <div class="content page">
    <a class="back" href="#home">← Volver</a>
    <h2>Mis dulces</h2>
    <p class="sub">Edita los nombres, elimina los que ya no quieras o agrega nuevos.</p>
    <div class="panel">
      <div id="candyList"></div>
      <form class="row" id="candyForm" onsubmit="return false">
        <input type="text" id="candyNew" placeholder="Nuevo dulce" aria-label="Nuevo dulce">
        <button class="mini add" id="candyAdd" type="button">Agregar</button>
      </form>
      <p class="note">Se guarda en este navegador.</p>
    </div>
  </div>
</section>

<!-- RETOS -->
<section class="view" id="retos">
  <div class="layer" id="pumps"></div>
  <div class="layer"><div class="fire"></div></div>
  <div class="content page">
    <a class="back" href="#home">← Volver</a>
    <h2>Los 6 retos</h2>
    <p class="sub">Cada caja es un reto. Escribe encima para cambiarlo.</p>
    <div class="grid" id="dares"></div>
    <p class="note">Se guarda en este navegador.</p>
  </div>
</section>

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* Fondo inicio: telarañas y murciélagos */
const webSVG='<svg viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1.2"><path d="M0 0H200M0 0L190 70M0 0L150 150M0 0L70 190M0 0V200"/><path d="M0 40Q35 35 40 0M0 85Q70 70 85 0M0 130Q105 105 130 0M0 175Q140 140 175 0"/></svg>';
$('.webs').innerHTML=['tl','tr','bl','br'].map(c=>`<div class="web ${c}">${webSVG}</div>`).join('');
const batSVG='<svg viewBox="-30 -14 60 28"><path d="M0 -4Q-6 -12 -14 -10Q-10 -6 -12 -2Q-20 -6 -28 -2Q-20 0 -18 8Q-12 2 -8 6Q-4 2 0 8Q4 2 8 6Q12 2 18 8Q20 0 28 -2Q20 -6 12 -2Q10 -6 14 -10Q6 -12 0 -4Z"/></svg>';
$('#bats').innerHTML=[[30,9,0],[42,12,3],[50,8,6],[36,14,9],[56,10,12]].map(([t,d,dl])=>`<div class="bat" style="top:${t}%;animation-duration:${d}s;animation-delay:-${dl}s;width:${40+d*2}px">${batSVG}</div>`).join('');

/* Calabazas */
$('#pumps').innerHTML=[[18,11,0],[38,14,4],[58,12,8],[28,16,2]].map(([t,d,dl])=>`<div class="pump" style="top:${t}%;animation-duration:${d}s;animation-delay:-${dl}s">🎃</div>`).join('');

/* Lista de dulces */
let candies=store.get('hw_dulces',['Chocolates','Gomitas','Paletas','Caramelos de menta']);
function drawCandies(){
  const el=$('#candyList');el.innerHTML='';
  if(!candies.length){el.innerHTML='<p>No hay dulces. Agrega el primero abajo.</p>'}
  candies.forEach((c,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<input type="text" aria-label="Dulce"><button class="mini" type="button">Eliminar</button>';
    const inp=r.firstChild;inp.value=c;
    inp.oninput=()=>{candies[i]=inp.value;store.set('hw_dulces',candies)};
    r.lastChild.onclick=()=>{candies.splice(i,1);store.set('hw_dulces',candies);drawCandies()};
    el.appendChild(r);
  });
}
function addCandy(){const v=$('#candyNew').value.trim();if(!v)return;candies.push(v);store.set('hw_dulces',candies);$('#candyNew').value='';drawCandies()}
$('#candyAdd').onclick=addCandy;
$('#candyNew').onkeydown=e=>{if(e.key==='Enter')addCandy()};
drawCandies();

/* Retos */
let dares=store.get('hw_retos',['Cuenta un chiste de miedo con voz de fantasma','Baila como momia durante 30 segundos','Come un dulce sin usar las manos','Imita a un vampiro por 1 minuto','Di un trabalenguas tres veces seguidas','Cuenta una historia de terror en 3 frases']);
$('#dares').innerHTML=dares.map((d,i)=>`<div class="box"><label for="d${i}">Reto ${i+1}</label><textarea id="d${i}"></textarea></div>`).join('');
dares.forEach((d,i)=>{const t=$('#d'+i);t.value=d;t.oninput=()=>{dares[i]=t.value;store.set('hw_retos',dares)}});

/* Navegación por hash */
function route(){
  const h=location.hash.slice(1);
  const id=['dulces','retos'].includes(h)?h:'home';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
